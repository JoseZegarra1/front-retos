name: CI-CD Frontend to Azure Static Web Apps

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  SWA_NAME: swa-retos-front
  RESOURCE_GROUP: kyndrylresource

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get deployment token
        run: |
          token=$(az staticwebapp secrets list \
            --name "${{ env.SWA_NAME }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --query properties.apiKey -o tsv)
          echo "::add-mask::$token"
          echo "SWA_CLI_DEPLOYMENT_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Deploy to Azure Static Web Apps
        run: npx --yes @azure/static-web-apps-cli deploy ./dist/frontend/browser --env production
